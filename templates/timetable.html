<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Crop Timetable</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style/bot.css') }}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      background-color: #121212;
      color: #f0f0f0;
    }
    h2, h3 {
      color: #66bb6a;
    }
    .form-control {
      background-color: #2c2c2c;
      border: 1px solid #444;
      color: white;
    }
    .form-control:focus {
      background-color: #2c2c2c;
      color: white;
      box-shadow: 0 0 5px #66bb6a;
    }
    .btn-success {
      background-color: #66bb6a;
      border: none;
    }
    .btn-success:hover {
      background-color: #57a05a;
    }
    .shadow {
      box-shadow: 0 0 20px rgba(0, 255, 100, 0.15) !important;
    }
    pre {
      background-color: #2c2c2c;
      padding: 10px;
      border-radius: 10px;
      color: #dcdcdc;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">🌾 FarmAssist</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">🏠 Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/weather">🌦️ Weather</a></li>
          <li class="nav-item"><a class="nav-link" href="/chat">💬 Diagnose</a></li>
          <li class="nav-item"><a class="nav-link" href="/news">📰 News</a></li>
          <li class="nav-item"><a class="nav-link" href="/bots">🧠 Chatbot</a></li>
          <li class="nav-item"><a class="nav-link active" href="/timetable">📅 Timetable</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Content -->
  <div class="container mt-5">
    <h2 class="text-center mb-4">📅 Smart Crop Timetable Generator</h2>
    <form method="POST" action="/timetable">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Crop Name:</label>
          <input type="text" class="form-control" name="crop" required>
        </div>
        <div class="col-md-6 mb-3">
          <label>Soil Type:</label>
          <input type="text" class="form-control" name="soil" required>
        </div>
        <div class="col-md-6 mb-3">
          <label>Region:</label>
          <input type="text" class="form-control" name="region" required>
        </div>
        <div class="col-md-6 mb-3">
          <label>Start Date:</label>
          <input type="date" class="form-control" name="start_date" required>
        </div>
      </div>
      <div class="text-center">
        <button type="submit" class="btn btn-success px-4">Generate Timetable</button>
      </div>
    </form>

    {% if output %}
    <div class="mt-5 shadow p-4 rounded">
      <h3>📋 Generated Timetable</h3>
      <pre>{{ output }}</pre>
    </div>
    {% endif %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
